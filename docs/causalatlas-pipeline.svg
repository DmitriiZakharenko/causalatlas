<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">CausalAtlas evidence-to-experiment pipeline</title>
  <desc id="desc">Four clean stages connect a biomedical question to an evidence-backed experiment.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#1ca78a"/><stop offset="1" stop-color="#4c6fff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#233047" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1280" height="520" rx="28" fill="#f8fafc"/>
  <rect x="1" y="1" width="1278" height="518" rx="28" fill="none" stroke="#e5eaf1"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="68" y="70" fill="#1ca78a" font-size="15" font-weight="800" letter-spacing="3">CAUSALATLAS / RESEARCH FLOW</text>
    <text x="68" y="118" fill="#152238" font-size="38" font-weight="760">From evidence to experiment</text>
    <text x="68" y="148" fill="#65748b" font-size="16">A transparent path from a disease–target question to a falsifiable mechanistic hypothesis.</text>
  </g>
  <path d="M168 290 H1112" fill="none" stroke="#d9e1ec" stroke-width="3"/>
  <path d="M210 290 H1070" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="7 10"/>
  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(58 205)"><rect width="250" height="170" rx="18" fill="#fff" stroke="#b9eadc"/><circle cx="30" cy="32" r="12" fill="#e2f8f1"/><text x="25" y="37" fill="#14836e" font-size="13" font-weight="800">01</text><text x="58" y="37" fill="#14836e" font-size="12" font-weight="800" letter-spacing="1.5">EVIDENCE</text><text x="24" y="82" fill="#152238" font-size="21" font-weight="750">Canonical +</text><text x="24" y="110" fill="#152238" font-size="21" font-weight="750">literature</text><text x="24" y="143" fill="#65748b" font-size="14">verified claims</text></g>
    <g transform="translate(350 205)"><rect width="250" height="170" rx="18" fill="#fff" stroke="#cbd6ff"/><circle cx="30" cy="32" r="12" fill="#e9edff"/><text x="25" y="37" fill="#4c6fff" font-size="13" font-weight="800">02</text><text x="58" y="37" fill="#4c6fff" font-size="12" font-weight="800" letter-spacing="1.5">STRUCTURE</text><text x="24" y="82" fill="#152238" font-size="21" font-weight="750">Causal graph</text><text x="24" y="110" fill="#152238" font-size="21" font-weight="750">&amp; graph checks</text><text x="24" y="143" fill="#65748b" font-size="14">loops · gaps · conflicts</text></g>
    <g transform="translate(642 205)"><rect width="250" height="170" rx="18" fill="#fff" stroke="#e5d1ff"/><circle cx="30" cy="32" r="12" fill="#f4eaff"/><text x="25" y="37" fill="#9254c7" font-size="13" font-weight="800">03</text><text x="58" y="37" fill="#9254c7" font-size="12" font-weight="800" letter-spacing="1.5">GATE</text><text x="24" y="82" fill="#152238" font-size="21" font-weight="750">Novelty</text><text x="24" y="110" fill="#152238" font-size="21" font-weight="750">verification</text><text x="24" y="143" fill="#65748b" font-size="14">independent search</text></g>
    <g transform="translate(934 205)"><rect width="250" height="170" rx="18" fill="#fff" stroke="#ffe0b5"/><circle cx="30" cy="32" r="12" fill="#fff1dc"/><text x="25" y="37" fill="#c47718" font-size="13" font-weight="800">04</text><text x="58" y="37" fill="#c47718" font-size="12" font-weight="800" letter-spacing="1.5">ACTION</text><text x="24" y="82" fill="#152238" font-size="21" font-weight="750">Peer review</text><text x="24" y="110" fill="#152238" font-size="21" font-weight="750">→ experiment</text><text x="24" y="143" fill="#65748b" font-size="14">falsifiable next step</text></g>
  </g>
  <g fill="#fff" stroke="url(#accent)" stroke-width="3"><circle cx="329" cy="290" r="8"/><circle cx="621" cy="290" r="8"/><circle cx="913" cy="290" r="8"/></g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif"><text x="68" y="450" fill="#8a98aa" font-size="14">disease + target</text><text x="350" y="450" fill="#8a98aa" font-size="14">provenance</text><text x="642" y="450" fill="#8a98aa" font-size="14">independent checks</text><text x="934" y="450" fill="#8a98aa" font-size="14">reproducible decisions</text></g>
</svg>

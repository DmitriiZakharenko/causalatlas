# Agent 7 — Loop Discovery Engine

## Role
Detect biological feedback cycles in the merged knowledge graph using strongly connected
components and cycle detection (Johnson/Tarjan). Must identify: positive feedback loops,
epithelial-immune loops, bone marrow-tissue loops, cytokine amplification loops, chronic
inflammation self-sustaining circuits, and immune memory loops. This agent's single
responsibility is topological cycle detection — scoring/ranking loops by biological
importance is Agent 8's job (topology metrics feed the ranking).

## Inputs
- `data/graphs/<disease>/knowledge_graph.json` (Agent 6 output) — nodes + edges only, not
  session-level provenance detail beyond what's needed to attach PMIDs to loop edges.

## Outputs
`data/graphs/<disease>/loops.json`, schema:
```json
{
  "disease": "asthma",
  "loops": [
    {
      "loop_id": "L001",
      "category": "positive_feedback",
      "path": ["Th2 cell", "IL-4", "Th2 cell"],
      "edges_pmids": {"Th2 cell->IL-4": ["..."], "IL-4->Th2 cell": ["..."]},
      "completeness": 1.0
    }
  ]
}
```

## Hard constraints
- A cycle is only reported if every edge in the path exists in the graph with real PMID
  support — NEVER report a "loop" that requires an inferred/missing edge as if it were
  complete; report it as partial (`completeness < 1.0`) instead, with the missing edge named.
- Categorize every loop into at least one of the six mandatory categories; if a detected
  cycle doesn't clearly fit one, say so explicitly rather than forcing a mislabel.
- Loop detection runs over the *whole* graph, not a hand-picked subgraph — a loop that only
  shows up when you restrict to "known important" nodes is a sign of a hardcoded target
  pair, which Agent 9 is separately required not to do either.

## Negative examples
**Real historical case this agent must handle correctly:** `reports/session_001_asthma_kg.md`
§7 documents "IL-5 eosinophil amplification" as only 67% complete — "missing: Eosinophil →
Airway inflammation as direct extracted edge; both nodes exist separately" — and the
"Tissue-resident memory chronicity loop" (Batf3 → Dendritic cell → TRM → Airway inflammation)
also at 67% complete, missing the Dendritic cell → TRM edge. Both were still reported as
loops with their true completeness score, not silently rounded up to 100% or dropped because
they were "almost" complete. This is the required behavior: an incomplete loop is real,
reportable information (it tells Agent 9 exactly which edge to gap-scan for), not something
to hide.

## Success criteria
- Every loop's `completeness` score is independently reproducible by checking whether all
  edges in `path` exist in the input graph.
- Partial loops list their missing edge(s) explicitly, feeding directly into Agent 9's gap
  scan.
- No loop is reported whose constituent edges cannot each be traced to a PMID."""
